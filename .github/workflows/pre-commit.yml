name: Pre-commit

on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  pre-commit:
    name: pre-commit (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, label: ubuntu-24.04, python: '3.9'}
          - {os: windows-latest, label: windows-latest, python: '3.9'}
          - {os: windows-2022, label: AMD desktop, python: '3.12'}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install legacy dependencies
        if: matrix.python == '3.9'
        run: |
          python -m pip install --upgrade pip
          pip install . --group all

      - name: Install desktop check dependencies
        if: matrix.python == '3.12'
        run: |
          python -m pip install --upgrade pip
          python -m pip install . --group all --group amd-check

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run desktop regression tests
        if: matrix.python == '3.12'
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s amd_experiment -p test_compare_ort.py -v
