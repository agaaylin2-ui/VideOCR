[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "VideOCR"
dynamic = ["version"]
description = "Extract burned-in subtitles with VideOCR, including a Windows DirectML preview for the Radeon RX 9070 XT."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["machine-learning", "ocr", "deep-learning", "subtitles", "hardsub"]
authors = [{name = "Tim Lodemann"}]
requires-python = ">=3.9"
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "av",
    "cpuid",
    "Fast-SSIM",
    "opencc",
    "psutil",
    "PySimpleGUI",
    "psgdnd",
    "simplejpeg @ https://github.com/timminator/simplejpeg/releases/download/v1.9.1/simplejpeg-1.9.1-cp39-cp39-win_amd64.whl ; sys_platform == 'win32' and python_version == '3.9'",
    "simplejpeg @ https://github.com/timminator/simplejpeg/releases/download/v1.9.1/simplejpeg-1.9.1-cp39-cp39-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl ; sys_platform == 'linux' and python_version == '3.9'",
    "simplejpeg @ https://github.com/timminator/simplejpeg/releases/download/v1.9.1/simplejpeg-1.9.1-cp310-cp310-win_amd64.whl ; sys_platform == 'win32' and python_version == '3.10'",
    "simplejpeg @ https://github.com/timminator/simplejpeg/releases/download/v1.9.1/simplejpeg-1.9.1-cp310-cp310-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl ; sys_platform == 'linux' and python_version == '3.10'",
    "simplejpeg @ https://github.com/timminator/simplejpeg/releases/download/v1.9.1/simplejpeg-1.9.1-cp311-abi3-win_amd64.whl ; sys_platform == 'win32' and python_version >= '3.11'",
    "simplejpeg @ https://github.com/timminator/simplejpeg/releases/download/v1.9.1/simplejpeg-1.9.1-cp311-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl ; sys_platform == 'linux' and python_version >= '3.11'",
    "wakepy",
    "wordninja-enhanced",
    "PyTaskbar @ git+https://github.com/timminator/PyTaskbar.git ; sys_platform == 'win32'",
    "winotify ; sys_platform == 'win32'",
    "plyer ; sys_platform != 'win32'",
]

[dependency-groups]
dev = [
    "mypy==1.19.1",
    "types-psutil",
    "pre-commit",
    "ruff==0.15.7",
]
amd-check = [
    "numpy==1.26.4",
    "onnx==1.17.0",
    "onnxruntime-directml==1.24.4",
    "opencv-contrib-python==4.10.0.84",
    "av==17.1.0",
]
build = [
    "nuitka",
    "patchelf; sys_platform == 'linux'",
    "requests",
]
all = [
    { include-group = "dev" },
    { include-group = "build" },
]

[project.urls]
Homepage = "https://github.com/aylinlabs/VideoOCR-AMD"
documentation = "https://github.com/aylinlabs/VideoOCR-AMD/blob/master/README.md"
Repository = "https://github.com/aylinlabs/VideoOCR-AMD.git"
Issues = "https://github.com/aylinlabs/VideoOCR-AMD/issues"

[tool.mypy]
mypy_path = ["CLI", "amd_experiment"]
strict = true
exclude = [
    "VideOCR\\.build",
    "CLI/videocr_cli\\.build"
]

# The native ORT wheel and the optional PaddleX APIs lack PEP 561 types.
[[tool.mypy.overrides]]
module = ["onnxruntime", "paddlex", "paddlex.inference", "paddlex.inference.common.reader.image_reader"]
ignore_missing_imports = true

[tool.setuptools]
packages = []

[tool.setuptools.dynamic]
version = { attr = "_version.__version__" }

[tool.ruff]
exclude = ["build", "venv", ".venv", "__pycache__"]
preview = true
target-version = "py39"

[tool.ruff.per-file-target-version]
"amd_experiment/*.py" = "py312"
"windows/*.py" = "py312"
"tests/*.py" = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["E501", "SIM108", "SIM102", "SIM114"]

[tool.ruff.lint.isort]
known-first-party = ["videocr"]
